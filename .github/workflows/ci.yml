name: Test and build deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GRADIO_ANALYTICS_ENABLED: "False"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-serving.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-serving.txt great_expectations==1.5.8
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Build image
        run: docker build -f Dockerfile -t telco-churn:test .
      - name: Start with free-tier memory limit and custom PORT
        run: docker run -d --name telco-smoke --memory=512m --memory-swap=512m --cpus=1 -e PORT=10000 -p 10000:10000 telco-churn:test
      - name: Check health, UI and real prediction
        run: python scripts/smoke_test.py --url http://127.0.0.1:10000
      - name: Record memory and logs
        if: always()
        run: |
          docker stats --no-stream telco-smoke || true
          docker logs telco-smoke || true
      - name: Remove test container
        if: always()
        run: docker rm -f telco-smoke || true
